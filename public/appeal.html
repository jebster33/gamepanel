<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111210" />
    <meta name="robots" content="noindex" />
    <title>Ban appeal</title>
    <link rel="icon" type="image/png" href="/img/favicon-64.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #111210;
        --card: rgba(32, 33, 30, 0.72);
        --border: rgba(255, 255, 255, 0.1);
        --text: #ecebe6;
        --muted: #a19f96;
        --faint: #6f6d66;
        --lime: #c6f432;
        --lime-text: #c6f432;
        --lime-soft: rgba(198, 244, 50, 0.12);
        --red: #ff5f57;
        --amber: #ffb340;
        --input: rgba(0, 0, 0, 0.28);
        --mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f3f2ed;
          --card: rgba(255, 255, 255, 0.82);
          --border: rgba(0, 0, 0, 0.1);
          --text: #1b1c18;
          --muted: #5d5b53;
          --faint: #8c8a81;
          --lime-text: #4f6e00;
          --lime-soft: rgba(120, 160, 0, 0.12);
          --input: rgba(255, 255, 255, 0.9);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font: 15px/1.5 "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(1200px 500px at 10% -10%, rgba(198, 244, 50, 0.1), transparent 60%),
          var(--bg);
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 44px 16px 60px;
      }
      .brand {
        margin-bottom: 14px;
        font-size: 12.5px;
        color: var(--muted);
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 6vw, 34px);
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      .lede {
        margin: 8px 0 22px;
        color: var(--muted);
        white-space: pre-line;
      }
      .card {
        padding: 20px;
        margin-bottom: 14px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        backdrop-filter: blur(20px) saturate(1.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        margin-bottom: 12px;
        font-size: 13px;
        color: var(--muted);
      }
      input,
      textarea {
        display: block;
        width: 100%;
        margin-top: 5px;
        padding: 10px 12px;
        font: inherit;
        color: var(--text);
        background: var(--input);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--lime);
      }
      textarea {
        min-height: 130px;
        resize: vertical;
      }
      button {
        padding: 9px 16px;
        font: inherit;
        font-weight: 650;
        color: #111210;
        background: var(--lime);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .row label {
        flex: 1;
        margin: 0;
      }
      .msg {
        margin-top: 12px;
        font-size: 14px;
      }
      .msg.error {
        color: var(--red);
      }
      .code {
        display: inline-block;
        margin: 6px 0;
        padding: 6px 12px;
        font-family: var(--mono);
        font-size: 20px;
        letter-spacing: 0.12em;
        color: var(--lime-text);
        background: var(--lime-soft);
        border-radius: 10px;
      }
      .status {
        font-weight: 650;
      }
      .status.accepted {
        color: var(--lime-text);
      }
      .status.denied {
        color: var(--red);
      }
      .reply {
        margin-top: 8px;
        padding: 10px 12px;
        color: var(--muted);
        border-left: 3px solid var(--border);
        white-space: pre-line;
      }
      .hidden {
        display: none;
      }
      .faint {
        color: var(--faint);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" id="brand"></div>
      <h1>Appeal a ban</h1>
      <p class="lede" id="intro">Banned by mistake, or ready to come back? Tell us what happened and an admin will look at it.</p>

      <div class="card hidden" id="closed"><p style="margin:0">Appeals are not open on this server.</p></div>

      <form class="card" id="form" autocomplete="off">
        <h2>Your appeal</h2>
        <label>Your in-game name<input id="name" required maxlength="32" placeholder="Steve" /></label>
        <label>Why should the ban be lifted?<textarea id="message" required maxlength="2000" placeholder="What happened, and why it will not happen again."></textarea></label>
        <label>How to reach you (optional)<input id="contact" maxlength="120" placeholder="Discord name or email" /></label>
        <button type="submit" id="send">Send appeal</button>
        <div class="msg" id="form-msg"></div>
      </form>

      <div class="card hidden" id="done">
        <h2>Appeal sent</h2>
        <p style="margin:0">Keep this code to check on it:</p>
        <div class="code" id="new-code"></div>
        <p class="faint" style="margin:6px 0 0">It is the only way to see the answer here.</p>
      </div>

      <form class="card" id="check">
        <h2>Check an appeal</h2>
        <div class="row">
          <label>Your code<input id="code" maxlength="20" placeholder="ABCD1234" style="text-transform:uppercase" /></label>
          <button type="submit">Check</button>
        </div>
        <div class="msg" id="check-msg"></div>
      </form>
    </main>
    <script src="/js/appeal.js" type="module"></script>
  </body>
</html>
