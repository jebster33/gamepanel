# XcodeGen spec for building and testing on a Mac (GitHub Actions, see .github/workflows/ios.yml).
# On Windows the app builds with iosc from GamePanel/iosc.toml instead.
name: GamePanel
options:
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: com.jebster33
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  GamePanel:
    type: application
    platform: iOS
    sources: [GamePanel/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jebster33.gamepanel
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: build/xcode/Info.plist
      properties:
        CFBundleDisplayName: GamePanel
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: GamePanel connects to your panel on your home network.
  GamePanelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: GamePanel
    info:
      path: build/xcode/UITests-Info.plist
schemes:
  GamePanel:
    build:
      targets:
        GamePanel: all
        GamePanelUITests: [test]
    test:
      targets: [GamePanelUITests]
