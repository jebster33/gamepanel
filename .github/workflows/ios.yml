name: iOS app

# Builds ios/ with Xcode, starts a throwaway panel with demo servers, runs the app in the
# iOS Simulator against it and uploads a screenshot of every screen.
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start a demo panel
        run: |
          mkdir -p "$RUNNER_TEMP/gp"
          GP_DATA_DIR="$RUNNER_TEMP/gp" GP_PORT=8420 GP_HOST=127.0.0.1 nohup node server/index.js > "$RUNNER_TEMP/panel.log" 2>&1 &
          node ios/ci/seed-panel.mjs

      - name: Pick the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build and run the screenshot tour
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ios=[(k,v) for k,v in d.items() if 'iOS' in k]; ios.sort(key=lambda kv: [int(x) for x in kv[0].split('iOS-')[-1].split('-')]); print(next(x['udid'] for k,v in reversed(ios) for x in v if 'iPhone' in x['name'] and 'Pro' in x['name']))")
          echo "Simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" \
          TEST_RUNNER_PANEL_ADDRESS="127.0.0.1:8420" \
          xcodebuild test \
            -project ios/GamePanel.xcodeproj \
            -scheme GamePanel \
            -destination "id=$DEVICE" \
            -resultBundlePath "$RUNNER_TEMP/tour.xcresult" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*GamePanel|Test Case|passed|failed|\*\*" ; exit ${PIPESTATUS[0]}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ${{ runner.temp }}/panel.log
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
